name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: MP4 browser smoke test
        run: npm run test:e2e
      - name: Build package
        run: npm run build
      - name: Verify exported stylesheet
        run: test -f dist/universal-player.css
      - name: Verify website pages are built
        run: test -f dist/site/index.html && test -f dist/site/playground.html
      - name: Verify package contents
        run: npm run pack:check
